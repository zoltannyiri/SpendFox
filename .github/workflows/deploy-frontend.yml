name: Deploy SpendFox frontend

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5

      - name: Build feltöltése
        uses: actions/upload-pages-artifact@v3 
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publikálás GitHub Pagesre
        id: deployment
        uses: actions/deploy-pages@v4