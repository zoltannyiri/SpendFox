name: Deploy SpendFox Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spendfox-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Függőségek telepítése
        working-directory: web
        run: npm ci

      - name: Frontend build
        working-directory: web
        run: npm run build
        env:
          VITE_API_HOST: ${{ vars.VITE_API_HOST }}

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5

      - name: Build feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publikálás
        id: deployment
        uses: actions/deploy-pages@v4